plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.28-beta'
}

group = rootProject.group
version = rootProject.version

base {
    // NeoForge is released beside Fabric as an explicitly experimental asset.
    archivesName = 'craftdroid-neoforge'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    maven { url = 'https://maven.neoforged.net/releases' }
}

// Compile every shared module into the distributable mod. A normal Gradle
// project dependency is only present on the development classpath; it is not
// embedded in the mod JAR and previously left all API classes missing at
// runtime.
sourceSets {
    main {
        java {
            srcDir project(':api').file('src/main/java')
            srcDir project(':engine').file('src/main/java')
            // The complete visual client is loader-neutral vanilla code.
            // Both loader builds include this source set, but the standalone
            // engine module and dedicated-server sources do not.
            srcDir project(':engine').file('src/client/java')
            srcDir project(':tools').file('src/main/java')
        }
        resources {
            srcDir project(':engine').file('src/client/resources')
            srcDir project(':tools').file('src/main/resources')
        }
    }
}

def withTestMods = providers.gradleProperty('neoforge_modpack').map { it.toBoolean() }.getOrElse(false)
def residentProbe = providers.gradleProperty('resident_probe').getOrElse('')
if(!(residentProbe in ['', 'offline', 'live']))throw new GradleException('resident_probe must be offline or live')
def nativeReport = residentProbe ? "gametest-probe-${residentProbe}-results.xml" : withTestMods ? 'gametest-modpack-results.xml' : 'gametest-results.xml'
def nativeRunDir = residentProbe ? "build/gametest-probe-${residentProbe}" : withTestMods ? 'build/gametest-modpack' : 'build/gametest'

dependencies {
    implementation project(':api')
}

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

if (withTestMods) {
    dependencies { gametestRuntimeOnly fileTree(dir: 'build/testmods', include: '*.jar') }
}

neoForge {
    version = project.property('neoforge_version')

    // ModDev does not infer the active development mod merely from
    // neoforge.mods.toml. Without this declaration resources were visible in
    // the Mods list, but the class directory was not scanned as CraftDroid:
    // @Mod, key mappings, commands, networking, and engine setup never ran.
    mods {
        mineagent {
            sourceSet sourceSets.main
        }
    }

    mods {
        mineagent_test { sourceSet sourceSets.gametest }
    }
    runs {
        gametest {
            type = "gameTestServer"
            sourceSet = sourceSets.gametest
            mods = [project.neoForge.mods.getByName('mineagent'), project.neoForge.mods.getByName('mineagent_test')]
            gameDirectory = file(nativeRunDir)
            systemProperty 'craftdroid.residentProbe', residentProbe
            // Java HTTP clients do not read HTTPS_PROXY. Preserve the configured JVM proxy and CA trust for opt-in live probes.
            if(residentProbe) ['http.proxyHost','http.proxyPort','https.proxyHost','https.proxyPort','http.nonProxyHosts','javax.net.ssl.trustStore'].each { key ->
                if(System.getProperty(key))systemProperty key,System.getProperty(key)
            }
            jvmArgument '-Xmx3G'
            systemProperty 'craftdroid.modpackTests', withTestMods.toString()
            systemProperty 'neoforge.enabledGameTestNamespaces', 'mineagent_test'
            systemProperty 'neoforge.gameTestServer', 'true'
            systemProperty 'craftdroid.testReport', layout.buildDirectory.file(nativeReport).get().asFile.absolutePath
        }
        client {
            mods = [project.neoForge.mods.getByName('mineagent')]
            client()
        }
        server {
            mods = [project.neoForge.mods.getByName('mineagent')]
            server()
        }
    }
}

processResources {
    inputs.property 'version', project.version
    from(project(':tools').sourceSets.main.resources)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    filesMatching('META-INF/neoforge.mods.toml') {
        // NeoForge ModDev does not expand arbitrary Gradle placeholders by
        // default; without this, the installed mod reports "${version}".
        expand version: project.version
    }
}

tasks.named('runGametest') {
    timeout = java.time.Duration.ofMinutes(5)
    doFirst {
        delete layout.buildDirectory.file(nativeReport).get().asFile
        delete file(nativeRunDir+'/world')
        delete file(nativeRunDir+'/resident-probe.json')
        if(residentProbe=='live'&&!System.getenv('DEEPSEEK_API_KEY')&&!System.getenv('CRAFTDROID_DEEPSEEK_API_KEY'))
            throw new GradleException('Live probe requires DEEPSEEK_API_KEY or CRAFTDROID_DEEPSEEK_API_KEY in the process environment')
        if(withTestMods) {
            def lock = new groovy.json.JsonSlurper().parse(file('src/gametest/resources/modpack-lock.json'))
            def actual = fileTree(dir:'build/testmods',include:'*.jar').files.collect{it.name}.toSet()
            if(actual != lock.mods.collect{it.filename}.toSet())throw new GradleException('Run scripts/provision-neoforge-tests.py first; isolated mods do not match the lock')
            lock.mods.each { mod ->
                def bytes=file('build/testmods/'+mod.filename).bytes
                if(java.security.MessageDigest.getInstance('SHA-512').digest(bytes).encodeHex().toString()!=mod.sha512)
                    throw new GradleException('Test dependency checksum mismatch: '+mod.filename)
            }
        }
    }
}

tasks.register('verifyResidentGameTests') {
    dependsOn 'runGametest'
    doLast {
        def report = layout.buildDirectory.file(nativeReport).get().asFile
        if (!report.isFile()) throw new GradleException('Missing native NeoForge report')
        def factory = javax.xml.parsers.DocumentBuilderFactory.newInstance()
        factory.setFeature('http://apache.org/xml/features/disallow-doctype-decl', true)
        def xml = factory.newDocumentBuilder().parse(report)
        ['failure','error','skipped'].each { if(xml.getElementsByTagName(it).length) throw new GradleException("NeoForge tests contain ${it}") }
        def cases = xml.getElementsByTagName('testcase')
        def names = (0..<cases.length).collect { cases.item(it).getAttribute('name').toLowerCase() }
        if (!names.any { it.contains('residentlifecycleandpolicy') }) throw new GradleException('Required NeoForge resident scenario did not execute')
        if(!names.any{it.contains('tenresidentswithoutahuman')})throw new GradleException('Native population scenario did not execute')
        if(withTestMods&&!names.any{it.contains('realmachineports')})throw new GradleException('Real-mod scenario did not execute')
        if(residentProbe&&!names.any{it.contains('residentplanscraftsbuildsandremembers')})throw new GradleException('Behavioral resident probe did not execute')
        if(residentProbe=='live'&&!names.any{it.contains('residentsconverseandkeepindividualrelationshipnotes')})throw new GradleException('Live social probe did not execute')
        logger.lifecycle("Verified ${cases.length} native NeoForge scenarios")
    }
}
