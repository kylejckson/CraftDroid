plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.28-beta'
}

group = rootProject.group
version = rootProject.version

base {
    // NeoForge is released beside Fabric as an explicitly experimental asset.
    archivesName = 'craftdroid-neoforge'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    maven { url = 'https://maven.neoforged.net/releases' }
}

// Compile every shared module into the distributable mod. A normal Gradle
// project dependency is only present on the development classpath; it is not
// embedded in the mod JAR and previously left all API classes missing at
// runtime.
sourceSets {
    main {
        java {
            srcDir project(':api').file('src/main/java')
            srcDir project(':engine').file('src/main/java')
            // The complete visual client is loader-neutral vanilla code.
            // Both loader builds include this source set, but the standalone
            // engine module and dedicated-server sources do not.
            srcDir project(':engine').file('src/client/java')
            srcDir project(':tools').file('src/main/java')
        }
        resources {
            srcDir project(':engine').file('src/client/resources')
            srcDir project(':tools').file('src/main/resources')
        }
    }
}

dependencies {
    implementation project(':api')
}

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

neoForge {
    version = project.property('neoforge_version')

    // ModDev does not infer the active development mod merely from
    // neoforge.mods.toml. Without this declaration resources were visible in
    // the Mods list, but the class directory was not scanned as CraftDroid:
    // @Mod, key mappings, commands, networking, and engine setup never ran.
    mods {
        mineagent {
            sourceSet sourceSets.main
        }
    }

    mods {
        mineagent_test { sourceSet sourceSets.gametest }
    }
    runs {
        gametest {
            type = "gameTestServer"
            sourceSet = sourceSets.gametest
            mods = [project.neoForge.mods.getByName('mineagent'), project.neoForge.mods.getByName('mineagent_test')]
            gameDirectory = file('build/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'mineagent_test'
            systemProperty 'neoforge.gameTestServer', 'true'
            systemProperty 'craftdroid.testReport', layout.buildDirectory.file('gametest-results.xml').get().asFile.absolutePath
        }
        client {
            mods = [project.neoForge.mods.getByName('mineagent')]
            client()
        }
        server {
            mods = [project.neoForge.mods.getByName('mineagent')]
            server()
        }
    }
}

processResources {
    inputs.property 'version', project.version
    from(project(':tools').sourceSets.main.resources)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    filesMatching('META-INF/neoforge.mods.toml') {
        // NeoForge ModDev does not expand arbitrary Gradle placeholders by
        // default; without this, the installed mod reports "${version}".
        expand version: project.version
    }
}

tasks.named('runGametest') {
    timeout = java.time.Duration.ofMinutes(5)
    doFirst { delete layout.buildDirectory.file('gametest-results.xml').get().asFile }
}

tasks.register('verifyResidentGameTests') {
    dependsOn 'runGametest'
    doLast {
        def report = layout.buildDirectory.file('gametest-results.xml').get().asFile
        if (!report.isFile()) throw new GradleException('Missing native NeoForge report')
        def factory = javax.xml.parsers.DocumentBuilderFactory.newInstance()
        factory.setFeature('http://apache.org/xml/features/disallow-doctype-decl', true)
        def xml = factory.newDocumentBuilder().parse(report)
        ['failure','error','skipped'].each { if(xml.getElementsByTagName(it).length) throw new GradleException("NeoForge tests contain ${it}") }
        def cases = xml.getElementsByTagName('testcase')
        def names = (0..<cases.length).collect { cases.item(it).getAttribute('name').toLowerCase() }
        if (!names.any { it.contains('residentlifecycleandpolicy') }) throw new GradleException('Required NeoForge resident scenario did not execute')
        logger.lifecycle("Verified ${cases.length} native NeoForge scenarios")
    }
}
