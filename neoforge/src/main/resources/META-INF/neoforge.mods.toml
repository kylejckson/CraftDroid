modLoader = "javafml"
loaderVersion = "[4,)"
license = "LGPL-3.0-only"
issueTrackerURL = "https://github.com/kylejckson/CraftDroid/issues"

[[mods]]
modId = "mineagent"
version = "${version}"
displayName = "CraftDroid"
displayURL = "https://github.com/kylejckson/CraftDroid"
description = '''
AI-powered Minecraft companions that mine, build, fight, and explore alongside you.
CraftDroid is forked from MineAgent.
'''
authors = "kylejckson (CraftDroid fork), bingdongni (MineAgent upstream)"

[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"

[[mixins]]
config = "mineagent.mixins.json"

[[dependencies.mineagent]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,21.2)"
ordering = "NONE"
side = "BOTH"

[[dependencies.mineagent]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.21.2)"
ordering = "NONE"
side = "BOTH"
